  function d(x,add){if(!x)return"—";var t=new Date(x+"T12:00:00");if(add)t.setDate(t.getDate()+add);if(lang==="uz")return t.getFullYear()+"-yil "+t.getDate()+"-"+UZM[t.getMonth()];try{return t.toLocaleDateString(lang==="zh"?"zh-CN":(lang||"en"),{day:"numeric",month:"long",year:"numeric"});}catch(e){return x;}}
  function load(src){return new Promise(function(ok,no){var s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
  if(!ref||key.length<16){st.textContent=L.bad;return;}
  var sb=window.supabase.createClient(window.MN_SB.url,window.MN_SB.anonKey);
  sb.rpc("get_voucher",{p_ref:ref,p_key:key}).then(async function(r){
    var v=r.data; if(r.error||!v){st.textContent=L.bad;return;}
    if(!lang) lang=(v.kind==="b2c"&&C.labels[v.lang])?v.lang:"en"; lab();
    try{await load("assets/data/l10n/"+(C.labels[lang]?lang:"en")+".js");}catch(e){}
    var T=(window.MN_TOURS||{})[v.tour_id]||null, M=window.MN_L||{}, name=function(g,id){var x=(M[g]||{})[id];return x?(Array.isArray(x)?x[0]:x):id;};
    var days=T?T.days.length:null, nights=T?T.days.filter(function(x){return x.sleep;}).length:null;
    var title=(M.tours&&M.tours[v.tour_id]&&M.tours[v.tour_id][0])||v.tour_title||"";
    var det=v.details||{}, cfg=v.config||{}, full=v.kind==="b2b"||!v.total||(+v.paid||0)>=(+v.total||0)-0.5, DT=full?L.title:L.conf_title;
    var trav=(v.travellers||[]).map(function(t,i){return'<tr><td>'+(i+1)+'</td><td><b>'+esc(((t.last||"")+" "+(t.first||"")).trim()||t.name||"")+'</b></td><td>'+esc(t.nationality||t.citizenship||v.citizenship||"")+'</td><td>'+esc(t.passport||"")+'</td></tr>';}).join("");
    var cells=[[full?L.no:"№",v.ref],[L.dates,d(v.start_date)+(days?" — "+d(v.start_date,days-1):"")],[L.tour,days?L.dur.replace("{d}",days).replace("{n}",nights):""],[L.pax,v.pax]];
    if(v.kind==="b2b") cells.push([L.agency,v.agency]); else cells.push([L.lead,v.lead]);
    cells.push([L.hotel,name("hotels",det.hotel||cfg.hotel||(T&&T.hotel))]); if(det.room) cells.push([L.room,{twin_share:"Twin (shared)",twin:"Twin",single:"Single"}[det.room]||det.room]);
    cells.push([L.guide,det.guide_lang||cfg.guide||"English"]); var iss=v.issued?new Date(v.issued):new Date(); cells.push([L.issued,d(iss.getFullYear()+"-"+String(iss.getMonth()+1).padStart(2,"0")+"-"+String(iss.getDate()).padStart(2,"0"))]);
    var route="",prog="";
    if(T){var seq=[];T.days.forEach(function(x){if(x.sleep){var l=seq[seq.length-1];if(l&&l.c===x.sleep)l.n++;else seq.push({c:x.sleep,n:1});}});
      route='<div class="route">'+seq.map(function(s){return'<span>'+esc(name("cities",s.c))+' · '+s.n+' '+(s.n>1?L.nights:L.night)+'</span>';}).join('<i>→</i>')+'</div>';
      prog='<table><thead><tr><th>'+L.day+'</th><th>'+L.dates+'</th><th>'+L.route+'</th><th>'+L.prog+'</th></tr></thead><tbody>'+T.days.map(function(x,i){
        var mv=(x.move||[]).map(function(m){return name("cities",m[0])+" → "+name("cities",m[1]);}).join(", ");
        return'<tr><td><b>'+(i+1)+'</b></td><td>'+esc(d(v.start_date,i))+'</td><td>'+esc(mv||name("cities",x.sleep||(x.stops[0]||{}).city||""))+(x.sleep?'':' · '+L.end)+'</td><td>'+esc(x.stops.map(function(s){return name("sights",s.id);}).join(" · "))+'</td></tr>';}).join("")+'</tbody></table>';}
    var inc=T?'<h2>'+L.inc+'</h2><ul class="inc">'+T.inc.map(function(k){return'<li>'+esc(name("items",k))+'</li>';}).join("")+'</ul>':"";
    var svc=(v.services||[]).length?'<h2>'+L.svc+'</h2><table><tbody>'+v.services.map(function(s){return'<tr><td><b>'+esc(s.title)+'</b><br><small>'+esc([s.city,s.from?d(s.from)+(s.to?" — "+d(s.to):""):""].filter(Boolean).join(" · "))+'</small></td><td>'+esc(s.conf?L.conf+" "+s.conf:"")+'</td><td>'+esc(s.contact||"")+'</td></tr>';}).join("")+'</tbody></table>':"";

    var mny=function(n){return"$"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2});};
    var client=v.kind==="b2c"?'<h2>'+L.client+'</h2><table><tbody><tr><th style="width:34%">'+esc(L.lead)+'</th><td><b>'+esc(v.lead)+'</b>'+(v.citizenship?' · '+esc(v.citizenship):'')+'</td></tr><tr><th>'+esc(L.contacts_c)+'</th><td>'+esc([v.email,v.phone].filter(Boolean).join(" · "))+'</td></tr></tbody></table>':'';
    var payb="";
    if(v.kind==="b2c"&&v.total){var bal=Math.max(0,(+v.total)-(+v.paid||0));
      payb='<h2>'+L.payment+'</h2><table><tbody><tr><th style="width:34%">'+esc(L.total)+'</th><td><b>'+mny(v.total)+'</b></td></tr><tr><th>'+esc(L.paidl)+'</th><td><b>'+mny(v.paid)+'</b>'+((v.payments||[]).length?' <small>('+v.payments.map(function(p){return d(p.on)+" — "+(p.currency&&p.currency!=="USD"?Math.round(p.orig).toLocaleString("ru-RU")+" "+p.currency+" ≈ "+mny(p.amount):mny(p.amount));}).join("; ")+')</small>':'')+'</td></tr>'+
        (bal>0?'<tr><th>'+esc(L.bal)+'</th><td><b style="color:var(--terra)">'+mny(bal)+'</b>'+(v.balance_due?' — '+esc(L.due)+' '+esc(d(v.balance_due)):'')+'</td></tr>':'')+'</tbody></table>'+(full?'':'<p class="sub" style="margin:2mm 0 0">'+esc(L.confirmed_txt)+'</p>');}
    var R=C.req, reqb='<h2>'+L.req+'</h2><table class="req"><tbody><tr><th style="width:34%">'+esc(R.company)+'</th><td>'+esc(L.addr)+': '+esc(R.address)+'</td></tr><tr><th>'+esc(L.inn)+': '+esc(R.inn)+'</th><td>'+esc(L.bank)+': '+esc(R.bank)+' · '+esc(L.mfo)+': '+esc(R.mfo)+'</td></tr><tr><th>'+esc(L.acc)+'</th><td>'+esc(R.account)+'</td></tr><tr><th>'+esc(L.lic)+'</th><td>№ '+esc(R.license)+' ('+esc(R.license_reg)+')</td></tr></tbody></table>';

    if(P.get("doc")==="services"){
      var sv=v.services||[];
      if(!sv.length||!full){st.textContent=L.sv_lock;return;}
      var guests=(v.travellers||[]).map(function(t){return((t.last||"")+" "+(t.first||"")).trim()||t.name;}).filter(Boolean);
      if(!guests.length&&v.lead)guests=[v.lead];
      var cname=function(c){return c?name("cities",c):"";};
      box.innerHTML=sv.map(function(s,i){
        var kl=L["k_"+s.kind]||L.k_other, rows=[];
        rows.push([L.f_guests,guests.join(", ")+(v.pax?" ("+v.pax+")":"")]);
        if(s.title)rows.push([L.f_prov,s.title]);
        if(s.city||s.to_city)rows.push([L.f_city,cname(s.city)+(s.to_city?" → "+(s.to_city==="airport"?"✈":cname(s.to_city)):"")]);
        if(s.from)rows.push([L.f_date,d(s.from)+(s.to&&s.to!==s.from?" — "+d(s.to)+(s.kind==="hotel"?" ("+Math.round((new Date(s.to)-new Date(s.from))/864e5)+" "+L.nights+")":""):"")]);
        if(s.time||s.place)rows.push([L.f_time,[s.time,s.place].filter(Boolean).join(" · ")]);
        if(s.conf)rows.push([L.f_conf,s.conf]);
        if(s.contact)rows.push([L.f_contact,s.contact]);
        if(s.details)rows.push([L.f_notes,s.details]);
        return '<div class="sv-page">'+C.rose+'<header class="hd">'+C.logo+'<div class="brand"><b>MOVIY NOMAD</b><small>MOVIY TRAVEL XK · '+esc(C.licence)+'</small></div><div class="ttl"><b>'+esc(L.sv_title)+'</b><span>'+esc(v.ref)+'-'+(i+1)+' · '+(i+1)+' '+esc(L.of)+' '+sv.length+'</span></div></header>'+
          '<h1>'+esc(kl)+'</h1><p class="sub">'+esc(title)+'</p><table class="svt"><tbody>'+rows.map(function(r){return'<tr><th>'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>';}).join("")+'</tbody></table>'+
          '<div class="ft"><div><p><b>'+esc(L.contacts)+':</b> WhatsApp '+esc(C.phone)+' · Telegram @'+esc(C.telegram)+(C.email?' · E-mail '+esc(C.email):'')+'</p><p>'+esc(L.sv_note)+'</p></div></div><p class="legal">'+esc(C.company)+'</p></div>';
      }).join("");
      box.classList.add("v--svc"); st.hidden=true; box.hidden=false; document.getElementById("bar").hidden=false; fit(); window.addEventListener("resize",fit);
      document.getElementById("b-dl").textContent=L.dl; document.getElementById("b-pr").textContent=L.print; document.title=L.sv_title+" "+v.ref+" — Moviy Nomad";
      return;
    }
    var url=location.origin+location.pathname+"?ref="+encodeURIComponent(ref)+"&k="+encodeURIComponent(key);
    var qr=""; try{var q=qrcode(0,"M");q.addData(url);q.make();qr=q.createSvgTag({cellSize:3,margin:0});}catch(e){}
    box.innerHTML=C.rose+'<header class="hd">'+C.logo+'<div class="brand"><b>MOVIY NOMAD</b><small>MOVIY TRAVEL XK · '+esc(C.licence)+'</small></div><div class="ttl"><b>'+esc(DT)+'</b><span>'+esc(v.ref)+'</span></div></header>'+
      '<div class="stamp">'+esc(full?L.paid:L.part)+'</div><h1>'+esc(title)+'</h1><p class="sub">'+esc(d(v.start_date))+(days?' — '+esc(d(v.start_date,days-1)):'')+'</p>'+
      '<div class="grid">'+cells.filter(function(c){return c[1];}).map(function(c){return'<div class="cell"><small>'+esc(c[0])+'</small><b>'+esc(c[1])+'</b></div>';}).join("")+'</div>'+
      client+payb+(route?'<h2>'+L.route+'</h2>'+route:'')+(trav?'<h2>'+L.pax+'</h2><table><tbody>'+trav+'</tbody></table>':'')+svc+(prog?'<h2>'+L.prog+'</h2>'+prog:'')+inc+reqb+
      '<div class="ft"><div class="qr" title="'+esc(L.verify)+'">'+qr+'</div><div><p><b>'+esc(L.contacts)+':</b> WhatsApp '+esc(C.phone)+' · Telegram @'+esc(C.telegram)+(C.email?' · E-mail '+esc(C.email):'')+'</p><p>'+esc(L.note)+'</p><p><small>'+esc(L.verify)+'</small></p></div></div>'+
      '<p class="legal">'+esc(C.company)+'</p>';
    st.hidden=true; box.hidden=false; document.getElementById("bar").hidden=false;
    paginate(v.ref, title);
    document.getElementById("b-dl").textContent=L.dl; document.getElementById("b-pr").textContent=L.print; document.title=DT+" "+v.ref+" — Moviy Nomad";
  });
  // ---- split the voucher into real A4 pages: own border + page number on each, blocks never cut, long tables continue
  function paginate(ref, title){
    var tmp=document.createElement("div"); tmp.innerHTML=box.innerHTML;
    var items=[].slice.call(tmp.children).filter(function(e){return !e.classList.contains("rose");});
    box.innerHTML=""; box.classList.add("v--pages"); box.style.zoom="";
    var pages=[], cur;
    function newPage(){
      var pg=document.createElement("section"); pg.className="vp"; pg.innerHTML=C.rose+'<div class="vpi"></div><div class="vpn"></div>';
      box.appendChild(pg); pages.push(pg); cur=pg.querySelector(".vpi");
      if(pages.length>1) cur.insertAdjacentHTML("beforeend",'<div class="vph"><b>MOVIY NOMAD</b><span>'+esc(ref)+' · '+esc(title)+'</span></div>');
    }
    function over(){return cur.scrollHeight>cur.clientHeight+1;}
    function blocks(){return [].slice.call(cur.children).filter(function(e){return !e.classList.contains("vph")&&!e.classList.contains("stamp");});}
    newPage();
    items.forEach(function(it){
      cur.appendChild(it); if(!over()) return;
      var rows=it.tagName==="TABLE"&&it.tBodies[0]?[].slice.call(it.tBodies[0].rows):[];
      if(rows.length>1){                       // table: move rows that don't fit to the next page (header repeated)
        var tb=it.tBodies[0], rest=[];
        while(over()&&tb.rows.length>1) rest.unshift(tb.removeChild(tb.rows[tb.rows.length-1]));
        if(over()){ cur.removeChild(it); var hd=blocks().pop(); newPage(); if(hd&&hd.tagName==="H2") cur.appendChild(hd); cur.appendChild(it); }
        while(rest.length){
          var t2=it.cloneNode(false); if(it.tHead) t2.appendChild(it.tHead.cloneNode(true)); var b2=document.createElement("tbody"); t2.appendChild(b2);
          newPage(); cur.appendChild(t2);
          while(rest.length){ b2.appendChild(rest[0]); if(over()&&b2.rows.length>1){ b2.removeChild(b2.rows[b2.rows.length-1]); break; } rest.shift(); }
          it=t2;
        }
        return;
      }
      if(blocks().length<=1) return;           // a single block taller than a page: keep it
      cur.removeChild(it); var prev=blocks().pop();
      newPage(); if(prev&&prev.tagName==="H2") cur.appendChild(prev); cur.appendChild(it);
    });
    pages.forEach(function(pg,i){pg.querySelector(".vpn").textContent=ref+" · "+(i+1)+" / "+pages.length;});
    fit(); window.addEventListener("resize",fit);
  }
  function fit(){ var w=box.querySelector(".vp,.sv-page"); if(!w) return; var k=Math.min(1,(window.innerWidth-16)/w.offsetWidth); box.style.zoom=k<1?k:""; }
  document.getElementById("b-pr").onclick=function(){window.print();};
  document.getElementById("b-dl").onclick=async function(){
    var b=this; b.disabled=true;
    try{
      if(box.classList.contains("v--svc")){
        box.style.zoom=""; var pdf2=new window.jspdf.jsPDF({unit:"mm",format:"a4"}), pages=box.querySelectorAll(".sv-page");
        for(var i=0;i<pages.length;i++){var c2=await html2canvas(pages[i],{scale:2,backgroundColor:"#fffaf0"}); if(i&&i%2===0)pdf2.addPage(); pdf2.addImage(c2.toDataURL("image/jpeg",0.92),"JPEG",0,(i%2)*148.5,210,148.5);}
        pdf2.save("Moviy-Nomad-service-vouchers-"+ref+".pdf"); fit(); b.disabled=false; return;
      }
      var z=box.style.zoom; box.style.zoom="";
      var pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"}), vps=box.querySelectorAll(".vp");
      for(var j=0;j<vps.length;j++){var cv=await html2canvas(vps[j],{scale:2,backgroundColor:"#fffaf0",useCORS:true}); if(j)pdf.addPage(); pdf.addImage(cv.toDataURL("image/jpeg",0.9),"JPEG",0,0,210,297);}
      box.style.zoom=z; pdf.save("Moviy-Nomad-voucher-"+ref+".pdf");}catch(e){window.print();}
    b.disabled=false;};
})();
</script></body></html>
